name: shader validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/shader-validation.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "config/camera_snapshots.toml"
      - "config/ddgi_convergence_acceptance.toml"
      - "docs/ddgi_convergence_calibration.md"
      - "docs/ddgi_indirect_transport_spec.md"
      - "docs/ddgi_migration_plan.md"
      - "docs/ddgi_transport_acceptance.md"
      - "crates/re-flora-shader-build/**"
      - "crates/re-flora-vkn/**"
      - "scripts/check_latest_run_log.py"
      - "scripts/check_shader_manifest.py"
      - "scripts/analyze_environment_irradiance_capture.py"
      - "scripts/analyze_bd2_blue_voxel.py"
      - "scripts/check_bd2_blue_voxel.sh"
      - "scripts/check_ddgi*.sh"
      - "scripts/check_ddgi_sky_normalization_evidence.py"
      - "scripts/install_slang.py"
      - "scripts/lib/**"
      - "scripts/run_slang_tests.py"
      - "scripts/summarize_ddgi_convergence.py"
      - "scripts/tests/**"
      - "scripts/validate_capture_process_evidence.py"
      - "scripts/validate_spirv_artifacts.py"
      - "shader/**"
      - "src/app/core/environment_lighting_test_scene.rs"
      - "src/app/core/environment_irradiance_capture.rs"
      - "src/app/core/loading.rs"
      - "src/app/core/mod.rs"
      - "src/app/core/visible_terrain.rs"
      - "src/ddgi/**"
      - "src/environment_lighting.rs"
      - "src/main.rs"
      - "src/run_log.rs"
      - "src/tracer/mod.rs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shader-validation.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "config/camera_snapshots.toml"
      - "config/ddgi_convergence_acceptance.toml"
      - "docs/ddgi_convergence_calibration.md"
      - "docs/ddgi_indirect_transport_spec.md"
      - "docs/ddgi_migration_plan.md"
      - "docs/ddgi_transport_acceptance.md"
      - "crates/re-flora-shader-build/**"
      - "crates/re-flora-vkn/**"
      - "scripts/check_latest_run_log.py"
      - "scripts/check_shader_manifest.py"
      - "scripts/analyze_environment_irradiance_capture.py"
      - "scripts/analyze_bd2_blue_voxel.py"
      - "scripts/check_bd2_blue_voxel.sh"
      - "scripts/check_ddgi*.sh"
      - "scripts/check_ddgi_sky_normalization_evidence.py"
      - "scripts/install_slang.py"
      - "scripts/lib/**"
      - "scripts/run_slang_tests.py"
      - "scripts/summarize_ddgi_convergence.py"
      - "scripts/tests/**"
      - "scripts/validate_capture_process_evidence.py"
      - "scripts/validate_spirv_artifacts.py"
      - "shader/**"
      - "src/app/core/environment_lighting_test_scene.rs"
      - "src/app/core/environment_irradiance_capture.rs"
      - "src/app/core/loading.rs"
      - "src/app/core/mod.rs"
      - "src/app/core/visible_terrain.rs"
      - "src/ddgi/**"
      - "src/environment_lighting.rs"
      - "src/main.rs"
      - "src/run_log.rs"
      - "src/tracer/mod.rs"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows native compile
            os: windows-2025-vs2026
            validate_spirv: false
            moltenvk_smoke: false
          - name: macOS MoltenVK
            os: macos-15
            validate_spirv: true
            moltenvk_smoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install macOS build and validation dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja molten-vk spirv-tools vulkan-loader

      - name: Configure macOS Vulkan runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          loader_prefix="$(brew --prefix vulkan-loader)"
          molten_prefix="$(brew --prefix molten-vk)"
          molten_library=""
          for candidate in \
            "$molten_prefix/lib/libMoltenVK.dylib" \
            "$molten_prefix/libexec/MoltenVK.xcframework/macos-arm64_x86_64/libMoltenVK.dylib"
          do
            if [ -f "$candidate" ]; then
              molten_library="$candidate"
              break
            fi
          done
          if [ -z "$molten_library" ]; then
            echo "MoltenVK library not found under $molten_prefix" >&2
            exit 1
          fi
          icd="$RUNNER_TEMP/MoltenVK_icd.json"
          python - "$molten_library" "$icd" <<'PY'
          import json
          import pathlib
          import sys

          manifest = {
              "file_format_version": "1.0.0",
              "ICD": {"library_path": sys.argv[1], "api_version": "1.3.0"},
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(manifest), encoding="utf-8")
          PY
          echo "DYLD_LIBRARY_PATH=$loader_prefix/lib" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install cmake ninja -y

      - name: Set up Windows Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: false

      - name: Install pinned Slang
        shell: bash
        run: python scripts/install_slang.py --destination "$RUNNER_TEMP/slang" --github-env "$GITHUB_ENV"

      - name: Check native Slang build
        run: cargo check --locked

      - name: Run Slang CPU tests
        run: python scripts/run_slang_tests.py

      - name: Audit production shader entry points
        run: python3 scripts/check_shader_manifest.py

      - name: Validate aggregate SPIR-V
        if: matrix.validate_spirv
        run: python scripts/validate_spirv_artifacts.py

      - name: Smoke test native Slang through MoltenVK
        if: matrix.moltenvk_smoke
        shell: bash
        run: cargo run --release --locked --features no_validation_layer -- --hidden --mute --auto-exit 0.5

      - name: Check native Slang run log
        if: matrix.moltenvk_smoke
        run: python scripts/check_latest_run_log.py

  fedora:
    name: Fedora native compile
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 45

    steps:
      - name: Install build and validation dependencies
        run: |
          dnf install -y \
            alsa-lib-devel \
            clang-devel \
            cmake \
            curl \
            gcc \
            gcc-c++ \
            git \
            libX11-devel \
            libxcb-devel \
            libxkbcommon-devel \
            make \
            ninja-build \
            patch \
            pkgconf-pkg-config \
            python3 \
            spirv-tools \
            systemd-devel \
            vulkan-loader-devel \
            wayland-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Slang
        run: python3 scripts/install_slang.py --destination "$RUNNER_TEMP/slang" --github-env "$GITHUB_ENV"

      - name: Check native Slang build
        run: cargo check --locked

      - name: Run environment lighting source gates
        run: timeout 10m cargo test --locked environment_lighting::tests::

      - name: Run environment lighting acceptance scene gates
        run: >-
          timeout 10m cargo test --locked environment_lighting_test_scene::tests:: --
          --skip app::core::environment_lighting_test_scene::tests::patt_seam_replay_uses_the_saved_snapshot_and_only_punches_the_roof

      - name: Run process-bound log marker gate
        run: timeout 10m cargo test --locked startup_log_tests::

      - name: Run DDGI convergence evidence gates
        run: |
          timeout 10m cargo test --locked ddgi_convergence_evidence_tests::
          timeout 10m cargo test --locked runtime_convergence_budget_matches_the_acceptance_contract
          timeout 10m cargo test --locked private_payloads_format_exact_validation_and_terminal_identity

      - name: Run DDGI process and convergence policy gates
        run: >-
          timeout 5m python3 -m unittest
          scripts.tests.test_validate_capture_process_evidence
          scripts.tests.test_summarize_ddgi_convergence
          scripts.tests.test_check_ddgi_transport_acceptance
          scripts.tests.test_ddgi_capture_process_integration
          scripts.tests.test_ddgi_indirect_transport_spec

      - name: Run Slang CPU tests
        run: python3 scripts/run_slang_tests.py

      - name: Audit production shader entry points
        run: python3 scripts/check_shader_manifest.py

      - name: Validate aggregate SPIR-V
        run: python3 scripts/validate_spirv_artifacts.py

  python-policy-tests:
    name: Python shader policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run analyzer and acceptance runner tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
