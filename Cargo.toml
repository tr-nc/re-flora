slang-surface-instances-to-occupancy = [
    "re-flora-vkn/slang-surface-instances-to-occupancy",
]
slang-surface-make = ["re-flora-vkn/slang-surface-make"]
slang-surface-make-sparse = ["re-flora-vkn/slang-surface-make-sparse"]
slang-surface-occupancy-to-flora-instances = [
    "re-flora-vkn/slang-surface-occupancy-to-flora-instances",
]
slang-surface-prepare-active-flora-dispatch = [
    "re-flora-vkn/slang-surface-prepare-active-flora-dispatch",
