[package]
name = "re-flora"
version = "0.2.14"
edition = "2021"
default-run = "re-flora"

[dependencies]
resource_container_derive = { path = "./resource_container_derive" }
re-flora-vkn = { path = "crates/re-flora-vkn" }
re-flora-water = { path = "crates/re-flora-water" }
re-flora-terrain-collider = { path = "crates/re-flora-terrain-collider" }
winit = { version = "0.30", features = ["rwh_05"] }
chrono = { version = "0.4", features = ["clock"] }
# only enable debug assert for glam during debug builds
glam = { version = "0.32.1", features = ["debug-glam-assert", "bytemuck"] }
uuid = { version = "1.4", features = ["v4"] }
env_logger = "0.11"
comfy-table = "7.2.2"
log = "0.4.29"
time = "0.3.47"
egui = "0.34.1"
thiserror = "2.0.18"
egui-winit = "0.34.1"
noise = "0.9.0"
fastnoise-lite = "1.1.1"
rand = "0.10.1"
ordered-float = "5.3.0"
once_cell = "1.21.4"
indexmap = "2.13.1"
image = "0.25.10"
png = "0.18.1"
arboard = "3.6.1"
anyhow = "1.0.102"
bytemuck = "1.25.0"
petalsonic = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2"
tempfile = "3.23.0"
# or use a local development version

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", features = ["NSCursor"] }

[build-dependencies]
toml = "1.1.2"
shaderc = { version = "0.10.1", features = ["prefer-static-linking"] }
spirv-reflect = { git = "https://github.com/gwihlidal/spirv-reflect-rs.git", rev = "97298067e3b1c9ce05633d78f1183c14a3cc6acc" }

[features]
default = []
no_validation_layer = ["re-flora-vkn/no_validation_layer"]
slang-poc = ["slang-post-processing"]
slang-chunk-writer-buffer-setup = [
    "re-flora-vkn/slang-chunk-writer-buffer-setup",
]
slang-chunk-writer-modify-sample = [
    "re-flora-vkn/slang-chunk-writer-modify-sample",
]
slang-chunk-writer-solid-sample = [
    "re-flora-vkn/slang-chunk-writer-solid-sample",
]
slang-chunk-writer-voxel-property-sample = [
    "re-flora-vkn/slang-chunk-writer-voxel-property-sample",
]
slang-chunk-writer-terrain-fertility-brush = [
    "re-flora-vkn/slang-chunk-writer-terrain-fertility-brush",
]
slang-chunk-writer-terrain-moisture-brush = [
    "re-flora-vkn/slang-chunk-writer-terrain-moisture-brush",
]
slang-chunk-writer-terrain-moisture-spread = [
    "re-flora-vkn/slang-chunk-writer-terrain-moisture-spread",
]
slang-chunk-writer-terrain-soil-mix = [
    "re-flora-vkn/slang-chunk-writer-terrain-soil-mix",
]
slang-chunk-writer-terrain-smooth = [
    "slang-chunk-writer-terrain-smooth-apply",
    "slang-chunk-writer-terrain-smooth-heights",
    "slang-chunk-writer-terrain-smooth-target",
]
slang-chunk-writer-terrain-smooth-apply = [
    "re-flora-vkn/slang-chunk-writer-terrain-smooth-apply",
]
slang-chunk-writer-terrain-smooth-heights = [
    "re-flora-vkn/slang-chunk-writer-terrain-smooth-heights",
]
slang-chunk-writer-terrain-smooth-target = [
    "re-flora-vkn/slang-chunk-writer-terrain-smooth-target",
]
slang-chunk-writer-terrain-smooth-mbo = [
    "slang-chunk-writer-terrain-smooth-mbo-apply",
    "slang-chunk-writer-terrain-smooth-mbo-diffuse-ab",
    "slang-chunk-writer-terrain-smooth-mbo-diffuse-ba",
    "slang-chunk-writer-terrain-smooth-mbo-init",
    "slang-chunk-writer-terrain-smooth-mbo-score",
]
slang-chunk-writer-terrain-smooth-mbo-apply = [
    "re-flora-vkn/slang-chunk-writer-terrain-smooth-mbo-apply",
]
slang-chunk-writer-terrain-smooth-mbo-diffuse-ab = [
    "re-flora-vkn/slang-chunk-writer-terrain-smooth-mbo-diffuse-ab",
]
slang-chunk-writer-terrain-smooth-mbo-diffuse-ba = [
    "re-flora-vkn/slang-chunk-writer-terrain-smooth-mbo-diffuse-ba",
]
slang-chunk-writer-terrain-smooth-mbo-init = [
    "re-flora-vkn/slang-chunk-writer-terrain-smooth-mbo-init",
]
slang-chunk-writer-terrain-smooth-mbo-score = [
