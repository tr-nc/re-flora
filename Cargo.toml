[package]
name = "verdarium"
version = "0.1.0"
edition = "2021"
default-run = "verdarium"

[dependencies]
resource_container_derive = { path = "./resource_container_derive" }
verdarium-vkn = { path = "crates/verdarium-vkn" }
verdarium-water = { path = "crates/verdarium-water" }
verdarium-terrain-collider = { path = "crates/verdarium-terrain-collider" }
winit = { version = "0.30", features = ["rwh_05"] }
chrono = { version = "0.4", features = ["clock"] }
# only enable debug assert for glam during debug builds
glam = { version = "0.32.1", features = ["debug-glam-assert", "bytemuck"] }
uuid = { version = "1.4", features = ["v4"] }
env_logger = "0.11"
comfy-table = "7.2.2"
log = "0.4.29"
time = "0.3.47"
egui = "0.34.1"
thiserror = "2.0.18"
egui-winit = "0.34.1"
noise = "0.9.0"
fastnoise-lite = "1.1.1"
rand = "0.10.1"
ordered-float = "5.3.0"
once_cell = "1.21.4"
indexmap = "2.13.1"
image = "0.25.10"
anyhow = "1.0.102"
bytemuck = "1.25.0"
petalsonic = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2"
# or use a local development version

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", features = ["NSCursor"] }

[build-dependencies]
toml = "1.1.2"
shaderc = "0.10.1"
spirv-reflect = { git = "https://github.com/gwihlidal/spirv-reflect-rs.git", rev = "97298067e3b1c9ce05633d78f1183c14a3cc6acc" }

[features]
default = []
no_validation_layer = ["verdarium-vkn/no_validation_layer"]
sync_diagnostics = ["verdarium-vkn/sync_diagnostics"]

[profile.test]
# uncomment this line to use release build for tests
# inherits = "release"

# Keep the main game crate debuggable in dev builds, but compile the CPU MLS-MPM
# solver like hot-path code. The water crate exists specifically for this split:
# debug app iteration stays fast enough, while P2G/G2P transfer loops avoid the
# huge slowdown from unoptimized debug code and debug math assertions.
[profile.dev.package.verdarium-water]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.verdarium-terrain-collider]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.petalsonic]
opt-level = 3
