slang-denoiser = ["slang-denoiser-spatial", "slang-denoiser-temporal"]
slang-denoiser-spatial = ["re-flora-vkn/slang-denoiser-spatial"]
slang-denoiser-temporal = ["re-flora-vkn/slang-denoiser-temporal"]
slang-egui = ["re-flora-vkn/slang-egui"]
slang-flora = ["re-flora-vkn/slang-flora"]
